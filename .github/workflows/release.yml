name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        # --ignore-scripts skips the postinstall icon-generation step (needs
        # rsvg-convert which isn't on Windows runners); icons are pre-committed.
        run: npm ci --ignore-scripts

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OpenWhatsApp ${{ github.ref_name }}
          releaseBody: |
            ## What's new in 0.1.3

            **Performance / reliability**
            - Messages and notifications no longer lag after the window has
              been minimized to the tray for a while — Chromium's background
              timer throttling (the thing that made hidden browser tabs go
              quiet) is now disabled specifically for this window, the same
              fix Slack/Discord ship.

            **Feels more native**
            - Notifications are now clickable — clicking a toast (not just
              dismissing it) brings OpenWhatsApp to the foreground.
            - A small red dot now appears on the taskbar icon when you have
              unread messages, mirroring the "(N)" badge WhatsApp already
              puts in the window title.
            - Window size, position, and maximized state are now remembered
              across restarts instead of always reopening at a fixed size.
            - Ctrl+= / Ctrl+- / Ctrl+0 now zoom the page in/out/reset, like
              every browser and most desktop apps.
            - Copying images and pasting from the clipboard now goes through
              the full Clipboard API, not just plain text.
            - Added a "Start with Windows" toggle to the tray menu.
            - Turned off Edge's autofill dropdown, which looked out of place
              popping up over a dedicated chat client.

            See the [full commit history](https://github.com/Antoinenz/openwhatsapp/commits/main) for details.

            ## Installation
            Download **OpenWhatsApp_${{ github.ref_name }}_x64-setup.exe** below and run it.
            WebView2 is included with Windows 10/11 — no extra runtime needed.
          releaseDraft: false
          prerelease: false
